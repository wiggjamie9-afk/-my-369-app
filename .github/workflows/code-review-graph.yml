# Risk-scored PR review via code-review-graph.
# Local-first: the knowledge graph is built and queried on the CI runner;
# no source code is sent to any external service. Only needs GITHUB_TOKEN.
name: code-review-graph

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: tirth8205/code-review-graph@v2.3.6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
