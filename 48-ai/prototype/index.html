<title>48 AI Crew</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout concept: one iPhone-width column on the mock's night-navy ground, four tabs, bottom sheets for everything else.
   Palette: ink navy, panel navy, signal blue, job amber, ok green, alert rose. Type: Space Grotesk heads, Inter body. */
:root{
  color-scheme:dark;
  --ink:#070b17; --panel:#0d1424; --raise:#131d35; --line:#1f2b47;
  --text:#eaf0ff; --mute:#8d9bbd; --blue:#4f8cff; --amber:#fbbf24; --green:#34d399; --rose:#fb7185;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.shell{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--ink);box-shadow:0 0 0 1px var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.proto{font:600 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--amber);padding:6px 0 4px;text-align:center}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
h1{font:700 28px/1.1 var(--font-head);margin:6px 0 2px}
h2{font:600 11px/1.2 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}
.sub{color:var(--mute);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.card.hot{border-color:var(--blue);background:linear-gradient(180deg,#0f1a33,var(--panel))}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--raise);color:var(--mute)}
.pill.on{color:var(--green);border-color:#134e3f;background:#0a2a22}
.pill.amber{color:var(--amber);border-color:#5a4410;background:#2a2108}
.pill.rose{color:var(--rose);border-color:#5b1f2c;background:#2a0e15}
.pill.blue{color:var(--blue);border-color:#1d3c74;background:#0d1b38}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.btn{border:1px solid var(--line);background:var(--raise);border-radius:10px;padding:9px 12px;font-weight:600;font-size:13px}
.btn:active{transform:translateY(1px)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#2a1f00}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.actions .btn{padding:8px 4px;text-align:center}
.job{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.job:last-child{border-bottom:0}
.job time{font:600 12px var(--font-body);color:var(--mute);width:52px;flex:none;font-variant-numeric:tabular-nums}
.job b{display:block;font-weight:600}
.job small{color:var(--mute)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:6px 0 8px;gap:2px}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--mute);position:relative;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-selected=true]{color:var(--blue)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--rose);color:#fff;border-radius:99px;font-size:10px;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 4px}
.inbox{position:relative;overflow:hidden;border-radius:14px;margin-bottom:8px}
.inbox .card{touch-action:pan-y;transition:transform .18s}
.inbox .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;background:#2a0e15;color:var(--rose);font-weight:600}
.call{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;border:0;flex:none}
.call svg{width:18px;height:18px;fill:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .dow{font-size:11px;color:var(--mute);padding:4px 0}
.cal button{background:none;border:0;border-radius:10px;height:40px;position:relative;font-variant-numeric:tabular-nums}
.cal button.today{box-shadow:inset 0 0 0 1px var(--blue)}
.cal button.sel{background:var(--blue);color:#fff}
.cal button.has::after{content:"";position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--amber)}
.cal button.sel.has::after{background:#fff}
.cal button.mute{color:#3b4766}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 4px;font-weight:600;font-size:12px;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600;color:var(--mute)}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.stage{display:grid;place-items:center;padding:18px 12px 12px;text-align:center;border-radius:18px;border:1px solid var(--amber);background:radial-gradient(120% 90% at 50% 0%,#17274d 0%,var(--panel) 70%)}
.avatar{width:132px;height:132px;border-radius:50%;border:2px solid var(--blue);background:linear-gradient(160deg,#16284f,#0b1226);display:grid;place-items:center;position:relative}
.avatar svg{width:100%;height:100%}
.avatar>svg{width:104px;height:104px}
.avatar .mouth{transform-origin:50px 71px;transform:scaleY(.35)}
.avatar.talk .mouth{animation:talk .32s infinite alternate}
@keyframes talk{to{transform:scaleY(1.2)}}
@media (prefers-reduced-motion:reduce){.avatar.talk .mouth{animation:none;transform:scaleY(.9)}}
.stage h3{font:700 22px var(--font-head);margin:10px 0 0}
.meter{height:8px;background:var(--raise);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--amber);border-radius:99px}
.meter i.over{background:var(--rose)}
.quote{border-left:3px solid var(--blue);padding:2px 0 2px 10px;color:var(--text)}
label{display:block;font-size:11px;font-weight:600;color:var(--mute);margin:10px 0 4px;letter-spacing:.04em;text-transform:uppercase}
input[type=text],input[type=number],input[type=tel],input[type=time],input[type=date],select,textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
textarea{resize:vertical;min-height:60px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* sheet */
#sheet{position:fixed;inset:0;background:rgba(3,6,14,.7);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{width:100%;max-width:460px;max-height:92%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;
  padding:12px max(16px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-left,0px))}
#sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0 10px}
#sheet header h3{font:700 18px var(--font-head);margin:0}
#sheet .body{overflow-y:auto;padding-bottom:16px}
/* chat */
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{max-width:86%;padding:8px 11px;border-radius:14px;font-size:13.5px}
.msg.jane{background:var(--raise);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--blue);align-self:flex-end;border-bottom-right-radius:4px}
.msg.note{align-self:center;background:none;color:var(--mute);font-size:12px;text-align:center}
.send{display:flex;gap:8px;margin-top:10px}
.send input{flex:1}
/* splash */
#splash{position:fixed;inset:0;z-index:30;background:radial-gradient(90% 60% at 50% 30%,#12234a,var(--ink));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px}
.mark{font:700 20px var(--font-head);letter-spacing:.3em;color:var(--blue);text-align:center}
.mark b{display:block;font-size:118px;letter-spacing:0;line-height:.95;color:var(--text);text-shadow:0 0 38px rgba(79,140,255,.55)}
.mark span{letter-spacing:.4em;font-size:14px;color:var(--mute)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:9px 14px;z-index:40;font-weight:600;font-size:13px;max-width:min(92vw,420px)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.good{color:var(--green)}.bad{color:var(--rose)}.warn{color:var(--amber)}
.plan{display:block;width:100%;text-align:left;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.plan[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}
.plan b{font:700 16px var(--font-head)}
</style>

<div class="shell" id="shell">
  <div class="proto">Prototype · sample data · not connected to real calls</div>
  <main id="screen" aria-live="polite"></main>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Main">
    <button class="tab" role="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 11h16"/></svg>Today</button>
    <button class="tab" role="tab" data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2.5-7h11L20 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 13h4l1 2h6l1-2h4"/></svg>Inbox<span class="badge" id="inboxBadge" hidden>0</span></button>
    <button class="tab" role="tab" data-tab="bookings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 14h2M12 14h2M16 14h.01M8 17.5h2"/></svg>Bookings</button>
    <button class="tab" role="tab" data-tab="jane"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 4-6 8-6s7 2 8 6"/></svg>Jane</button>
  </nav>
</div>
<div id="sheet" hidden><div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><header><h3 id="sheetTitle"></h3><button class="btn sm" id="sheetClose">Close</button></header><div class="body" id="sheetBody"></div></div></div>
<div id="splash"><div class="mark">THE<b>48</b><span>AI CREW</span></div><button class="btn blue" id="splashGo" style="padding:12px 26px;font-size:15px">Open my desk</button><div class="sub" style="max-width:280px;text-align:center">Prototype with sample data. Nothing here places or answers real calls.</div></div>
<div id="toast" hidden></div>

<script>
(function () {
'use strict';
var $ = function (s, r) { return (r || document).querySelector(s); };
var pad = function (n) { return String(n).padStart(2, '0'); };
var iso = function (d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var uid = function () { return Math.random().toString(36).slice(2, 9); };
var KEY = '48ai.proto.v1';

/* ---------- plans (editable defaults; the first is the mock's plan) ---------- */
var PLANS = [
  { id: 'mock', name: 'Jane Pro (mock)', price: 49.99, minutes: 600, note: 'As drawn in the mock' },
  { id: 'starter', name: 'Starter', price: 59, minutes: 150, note: 'Suggested entry plan' },
  { id: 'pro', name: 'Pro', price: 129, minutes: 400, note: 'Suggested; test A$99-149' },
  { id: 'company', name: 'Company (4 users)', price: 199, minutes: 800, note: 'Suggested; shared pool' }
];

/* ---------- state ---------- */
function seed() {
  var t = new Date(), tm = new Date(t.getTime() + 864e5);
  var today = iso(t), tomorrow = iso(tm);
  return {
    biz: { name: "Wigg's Plumbing & Gas", owner: 'Wigg', phone: '0400 123 456', abn: '51 824 753 556', does: 'Plumber, gas fitting', area: 'Perth north, 25 km radius' },
    mode: 'on', lang: 'en', planId: 'mock', minutesUsed: 412, avatarUsed: 6,
    tab: 'today', selDate: today, cal: { y: t.getFullYear(), m: t.getMonth() }, splashSeen: false,
    jobs: [
      { id: uid(), date: today, time: '08:00', customer: 'Sarah Williams', job: 'Leaking tap, kitchen sink', address: '14 Karrinyup Rd, Karrinyup', phone: '0400 000 001', status: 'Booked', callId: 'c1' },
      { id: uid(), date: today, time: '09:30', customer: 'Mei Chen', job: 'Mow + edge', address: 'Duncraig', phone: '0400 000 002', status: 'Booked', callId: 'c2' },
      { id: uid(), date: today, time: '11:00', customer: 'Dave Collins', job: 'Quote: fence repair', address: 'Balga', phone: '0400 000 003', status: 'Quoted', callId: '' },
      { id: uid(), date: today, time: '13:30', customer: 'Rob Nguyen', job: 'AC service', address: 'Morley', phone: '0400 000 004', status: 'New', callId: '' },
      { id: uid(), date: tomorrow, time: '10:30', customer: 'Tom Baker', job: 'Switchboard check', address: 'Warwick', phone: '0400 000 005', status: 'Booked', callId: '' }
    ],
    inbox: [
      { id: uid(), name: 'Mick Thompson', need: 'Wants a quote for a full rewire, this week if possible', phone: '0400 000 006', urgent: true, when: '9:12 AM' },
      { id: uid(), name: 'Priya Sharma', need: 'Aircon not cooling. Call back after 10 please', phone: '0400 000 007', urgent: false, when: '8:47 AM' },
      { id: uid(), name: 'Dave Collins', need: 'Happy with the fence price, ready to book', phone: '0400 000 003', urgent: false, when: 'Yesterday' }
    ],
    calls: [
      { id: 'c1', date: today, name: 'Sarah Williams', outcome: 'Booked', minutes: 2.1, sample: true, transcript: [['Jane', "G'day, you've reached Wigg's Plumbing & Gas. I'm Jane, an AI assistant. This call may be recorded to help book your job. How can I help?"], ['Caller', 'My kitchen tap is leaking.'], ['Jane', "No worries. What's your name?"], ['Caller', 'Sarah Williams.'], ['Jane', 'Booked for 8:00 AM at 14 Karrinyup Rd. Wigg will text to confirm.']] },
      { id: 'c2', date: today, name: 'Mei Chen', outcome: 'Booked', minutes: 1.6, sample: true, transcript: [['Jane', 'Sample call: transcript not stored in this prototype.']] },
      { id: 'c3', date: today, name: 'Mick Thompson', outcome: 'Callback', minutes: 1.2, sample: true, transcript: [['Jane', 'Sample call: transcript not stored in this prototype.']] },
      { id: 'c4', date: today, name: 'Priya Sharma', outcome: 'Callback', minutes: 1.0, sample: true, transcript: [['Jane', 'Sample call: transcript not stored in this prototype.']] },
      { id: 'c5', date: today, name: 'Unknown', outcome: 'Message', minutes: 0.4, sample: true, transcript: [['Jane', 'Sample call: transcript not stored in this prototype.']] },
      { id: 'c6', date: today, name: 'Rob Nguyen', outcome: 'Booked', minutes: 1.8, sample: true, transcript: [['Jane', 'Sample call: transcript not stored in this prototype.']] }
    ]
  };
}
var S;
function load() { try { var r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return seed(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();

/* ---------- helpers ---------- */
function plan() { return PLANS.filter(function (p) { return p.id === S.planId; })[0] || PLANS[0]; }
function t12(t) { var p = t.split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + ' ' + (h < 12 ? 'AM' : 'PM'); }
function niceDate(d) { var x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'short' }); }
function jobsOn(d) { return S.jobs.filter(function (j) { return j.date === d; }).sort(function (a, b) { return a.time < b.time ? -1 : 1; }); }
var STATUS = { Booked: 'on', Quoted: 'amber', New: 'blue', Done: '' };
var ICON_PHONE = '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11 11 0 0 0 3.5.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.6 3.5a1 1 0 0 1-.25 1z"/></svg>';
var toastT;
function toast(msg) { var t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, 2600); }
function mapsUrl(a) { return 'https://maps.apple.com/?q=' + encodeURIComponent(a + ', Perth WA'); }

/* ---------- sheet ---------- */
function openSheet(title, html, mount) {
  $('#sheetTitle').textContent = title; $('#sheetBody').innerHTML = html; $('#sheet').hidden = false;
  $('#sheetBody').scrollTop = 0; if (mount) mount($('#sheetBody'));
  $('#sheetClose').focus();
}
function closeSheet() { $('#sheet').hidden = true; $('#sheetBody').innerHTML = ''; stopSpeak(); if (sim && sim.active) endCall(true); render(); }
$('#sheetClose').addEventListener('click', closeSheet);
$('#sheet').addEventListener('click', function (e) { if (e.target === $('#sheet')) closeSheet(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- screens ---------- */
function greeting(lang) {
  var b = S.biz.name, L = {
    en: "G'day, you've reached " + b + ". I'm Jane, an AI assistant. This call may be recorded to help book your job. How can I help?",
    es: 'Hola, ha llamado a ' + b + '. Soy Jane, una asistente de IA. Esta llamada puede grabarse para ayudar a reservar su trabajo. ¿En qué puedo ayudarle?',
    zh: '您好，这里是' + b + '。我是 Jane，一个 AI 助理。本次通话可能会被录音，以便为您安排服务。请问有什么可以帮您？',
    it: 'Buongiorno, ha chiamato ' + b + ". Sono Jane, un'assistente AI. La chiamata potrebbe essere registrata per aiutarla a prenotare il lavoro. Come posso aiutarla?",
    vi: 'Xin chào, quý khách đã gọi ' + b + '. Tôi là Jane, trợ lý AI. Cuộc gọi có thể được ghi âm để hỗ trợ đặt lịch. Tôi có thể giúp gì cho quý khách?'
  };
  return L[lang] || L.en;
}
function renderToday() {
  var td = iso(new Date()), list = jobsOn(td), nextJ = list.filter(function (j) { return j.status !== 'Done'; })[0];
  var calls = S.calls.filter(function (c) { return c.date === td; }).length, booked = list.filter(function (j) { return j.status === 'Booked'; }).length;
  var d = new Date();
  var h = '<div class="row between" style="margin-top:4px"><div><h1>Today</h1><div class="sub">' + d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · Perth · ☀ 24° <span class="pill" style="padding:1px 7px;font-size:10px">sample</span></div></div><button class="btn sm" data-act="biz" aria-label="Your business">Your business</button></div>';
  h += '<div style="margin:12px 0"><span class="pill ' + (S.mode === 'off' ? '' : 'on') + '"><span class="dot"></span>Jane is ' + (S.mode === 'off' ? 'OFF' : S.mode === 'after' ? 'ON after hours' : 'ON') + ' · ' + calls + ' calls · ' + booked + ' booked</span></div>';
  h += '<h2>Next job</h2>';
  if (nextJ) {
    h += '<div class="card hot"><div class="row between"><b style="font-size:17px">' + t12(nextJ.time) + '</b><span class="pill ' + STATUS[nextJ.status] + '">' + nextJ.status + '</span></div>' +
      '<div style="font:600 17px var(--font-head);margin-top:4px">' + esc(nextJ.customer) + '</div><div class="sub">' + esc(nextJ.job) + '</div><div class="sub">' + esc(nextJ.address) + '</div>' +
      '<div class="actions"><button class="btn" data-act="callback" data-id="' + nextJ.id + '">Call back</button><a class="btn" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="' + mapsUrl(nextJ.address) + '">Maps</a><button class="btn" data-act="play" data-id="' + nextJ.id + '">Play call</button><button class="btn" data-act="done" data-id="' + nextJ.id + '">Done</button></div></div>';

function tick() { var t = $('#timer'); if (t && sim) t.textContent = sim.mins.toFixed(1) + ' min'; if (sim && sim.mins >= 8 && sim.active) { say("I need to wrap up now. I'll ask " + owner() + ' to call you back.'); addCallback('Call ended at the 8-minute limit'); finish(); } }
function addCallback(need) {
  var d = sim.d; S.inbox.unshift({ id: uid(), name: d.name || 'Unknown caller', need: need || d.need || 'Wants a callback', phone: d.phone || 'Not given', urgent: sim.urgent, when: 'Just now' }); sim.outcome = 'Callback';
}
function callerSays(text) {
  if (!sim || !sim.active) return;
  sim.log.push(['Caller', text]); addMsg('me', text); sim.mins += 0.4; var d = sim.d, low = text.toLowerCase();
  setTimeout(function () { if (!sim || !sim.active) return; reply(text, low, d); tick(); var a = $('#av'); }, 350);
}
function reply(text, low, d) {
  if (sim.stage === 'done') {
    if (/^(no|nope|nah|that's (all|it)|thanks|thank you|bye|cheers)/.test(low)) { say('Thanks for calling ' + S.biz.name + '. Bye for now!'); finish(); } else { say("I've passed that on to " + owner() + '. Anything else?'); } return;
  }
  if (/\b(robot|bot|ai|artificial|machine|real person|real human|are you real)\b/.test(low) && /\?|are you|is this/.test(low)) { say("Yes, I'm an AI assistant for " + S.biz.name + '. I can book a job or take a message, and ' + owner() + ' will follow up.'); return; }
  if (/\b(speak|talk|put me through|get)\b.*\b(person|human|owner|someone|plumber|boss|manager)\b/.test(low)) { sim.stage = 'cb_name'; say("No worries. I'll ask " + owner() + ' to call you back. What’s your name?'); return; }
  if (/\b(how much|price|cost|quote|rates?|charge)\b/.test(low) && sim.stage === 'need') { d.need = 'Quote request'; d.quote = true; say("I can't give prices over the phone. " + owner() + " confirms them after seeing the job. I'll book a quote visit. What's your name?"); sim.stage = 'name'; return; }
  if (/\b(how much|price|cost|rates?|charge)\b/.test(low)) { say("I can't give prices over the phone. " + owner() + ' will confirm.'); return; }
  if (sim.stage === 'need') {
    if (EMERG_DANGER.test(low)) { sim.urgent = true; say("If anyone is in danger or you smell gas, leave the building and call 000 now. I'm marking this urgent for " + owner() + '.'); d.need = text; sim.stage = 'name'; say('Can I take your name so he can call you straight back?'); return; }
    if (EMERG_WATER.test(low)) { sim.urgent = true; d.need = text; say("That sounds urgent. If it's safe, turn the water off at the mains. I'm flagging it for " + owner() + '. What’s your name?'); sim.stage = 'name'; return; }
    if (text.trim().length < 4) { sim.fails++; if (sim.fails >= 2) { sim.stage = 'cb_name'; say("Sorry, I'm having trouble hearing you. I'll take a callback request. What's your name?"); } else say('Sorry, could you say that again?'); return; }
    d.need = text; say('Got it. What’s your name?'); sim.stage = 'name'; return;
  }
  if (sim.stage === 'name' || sim.stage === 'cb_name') { d.name = text.replace(/^(my name is|it's|its|this is|i'm|im|i am)\s+/i, '').replace(/[.!]+$/, '').trim().slice(0, 40); say('Thanks ' + d.name + '. ' + (sim.stage === 'cb_name' ? "What's the best number to reach you?" : 'What’s the address or suburb for the job?')); sim.stage = sim.stage === 'cb_name' ? 'cb_phone' : 'address'; return; }
  if (sim.stage === 'address') { d.address = text.slice(0, 60); say("And the best number to reach you on?"); sim.stage = 'phone'; return; }
  if (sim.stage === 'phone' || sim.stage === 'cb_phone') {
    var m = text.match(/(\+?\d[\d\s-]{7,})/); if (!m) { say("Sorry, I didn't catch a number. Could you say it again?"); return; }
    d.phone = m[1].trim();
    if (sim.stage === 'cb_phone') { addCallback('Asked for a callback'); say('Done. ' + owner() + ' will call you back on ' + d.phone + '. Anything else?'); sim.stage = 'done'; return; }
    if (sim.urgent) { addCallback(d.need); say("I've marked it urgent and told " + owner() + '. He’ll call you straight back on ' + d.phone + '. Anything else?'); sim.stage = 'done'; return; }
    say('When suits you? For example, tomorrow morning.'); sim.stage = 'when'; return;
  }
  if (sim.stage === 'when') {
    var w = parseWhen(low), s = freeSlot(w.date, w.hour), id = uid(), callId = 'sim' + id;
    S.jobs.push({ id: id, date: s.date, time: s.time, customer: d.name || 'Caller', job: d.quote ? 'Quote visit' : d.need.slice(0, 50), address: d.address || 'To confirm', phone: d.phone, status: d.quote ? 'Quoted' : 'Booked', callId: callId });
    sim.callId = callId; sim.outcome = 'Booked';
    say('All booked: ' + (d.quote ? 'a quote visit' : d.need.slice(0, 50)) + ' at ' + (d.address || 'your address') + ' on ' + niceDate(s.date) + ' at ' + t12(s.time) + '. I have your number as ' + d.phone + ". " + owner() + ' will text to confirm. Anything else?');
    sim.stage = 'done'; S.selDate = s.date;
  }
}
function finish() { endCall(false, true); }
function endCall(silent, skipSay) {
  if (!sim || !sim.active) return; sim.active = false; stopSpeak();
  if (!skipSay && !silent) { sim.log.push(['Jane', 'Call ended.']); }
  var mins = Math.max(0.3, Math.round(sim.mins * 10) / 10); S.minutesUsed += mins;
  S.calls.unshift({ id: sim.callId || ('c' + uid()), date: iso(new Date()), name: sim.d.name || 'Test caller', outcome: sim.outcome, minutes: mins, sample: false, transcript: sim.log.slice() });
  note('Call ended · ' + mins.toFixed(1) + ' min counted · outcome: ' + sim.outcome);
  var cb = $('#endBtn'); if (cb) cb.disabled = true; var si = $('#sendI'); if (si) si.disabled = true;
  save(); toast(sim.outcome === 'Booked' ? 'Job added to Bookings' : sim.outcome === 'Callback' ? 'Callback added to Inbox' : 'Call logged');
}

/* ---------- events ---------- */
$('#tabs').addEventListener('click', function (e) { var b = e.target.closest('.tab'); if (b) { S.tab = b.dataset.tab; render(); $('#screen').scrollTop = 0; } });
$('#screen').addEventListener('click', function (e) {
  var a = e.target.closest('[data-act]'); if (!a) return; var act = a.dataset.act, id = a.dataset.id;
  if (act === 'job') jobSheet(id);
  else if (act === 'done') { var j = jobById(id); if (j) { j.status = 'Done'; render(); toast('Marked done'); } }
  else if (act === 'callback') { var jb = jobById(id); toast('Call back ' + jb.customer + ' on ' + jb.phone); }
  else if (act === 'play') { var j2 = jobById(id); showTranscript(j2.callId); }
  else if (act === 'callin') { var m = S.inbox.filter(function (x) { return x.id === id; })[0]; if (m) toast('Call ' + m.name + ' on ' + m.phone); }
  else if (act === 'clear') clearInbox(id);
  else if (act === 'pick') { S.selDate = a.dataset.date; render(); }
  else if (act === 'prev') { S.cal.m--; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } render(); }
  else if (act === 'next') { S.cal.m++; if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } render(); }
  else if (act === 'addbook') addBooking();
  else if (act === 'biz') bizSheet();
  else if (act === 'mode') { S.mode = a.dataset.v; render(); toast('Jane is ' + (S.mode === 'off' ? 'off' : S.mode === 'on' ? 'on' : 'on after hours')); }
  else if (act === 'lang') { S.lang = a.dataset.v; render(); }
  else if (act === 'test') startCall();
  else if (act === 'plans') plansSheet();
});
function boot() {
  if (S.splashSeen) $('#splash').hidden = true;
  $('#splashGo').addEventListener('click', function () { S.splashSeen = true; $('#splash').hidden = true; save(); });
  render();
}
boot();
})();
</script>
